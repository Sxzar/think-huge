services:
  php:
    build: ./server/php
    volumes:
      - ./server:/var/www/server

  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./server/public:/var/www/server/public:ro
      - ./server/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
